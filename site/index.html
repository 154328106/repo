<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#07111f">
  <link rel="icon" type="image/png" href="CydiaIcon.png">
  <link rel="apple-touch-icon" href="CydiaIcon@3x.png">
  <title>无言以对</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; color: #eef7ff; background: #07111f; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 20% 10%, #174f8a 0, transparent 35%), radial-gradient(circle at 90% 90%, #3b2579 0, transparent 35%), #07111f; }
    main { width: min(620px, 100%); padding: 34px; border: 1px solid #ffffff25; border-radius: 28px; background: #ffffff12; box-shadow: 0 24px 80px #0008; backdrop-filter: blur(22px); }
    .mark { width: 72px; height: 72px; overflow: hidden; border-radius: 21px; box-shadow: 0 12px 32px #278fff55; }
    .mark img { display: block; width: 100%; height: 100%; object-fit: cover; }
    h1 { margin: 22px 0 8px; font-size: clamp(28px, 7vw, 42px); letter-spacing: -.04em; }
    p { color: #b9cbe0; line-height: 1.6; }
    code { display: block; margin: 20px 0; padding: 14px 16px; overflow-wrap: anywhere; border-radius: 14px; color: #c9eaff; background: #02081388; border: 1px solid #ffffff18; }
    .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 24px; }
    a { padding: 14px 16px; border-radius: 15px; text-align: center; text-decoration: none; font-weight: 700; color: white; background: linear-gradient(135deg, #2f9cff, #6757ed); }
    a.secondary { color: #d8e9fa; background: #ffffff12; border: 1px solid #ffffff20; }
    small { display: block; margin-top: 24px; color: #7890a9; }
    @media (max-width: 480px) { main { padding: 25px; } .buttons { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <div class="mark"><img src="CydiaIcon@2x.png" alt="无言以对图标"></div>
    <h1>无言以对</h1>
    <p>个人常用插件仓库，收录经过 Relaxin / RootHide 验证的软件包。</p>
    <code>https://154328106.github.io/repo/</code>
    <div class="buttons">
      <a href="sileo://source/https://154328106.github.io/repo/">添加到 Sileo</a>
      <a class="secondary" href="Packages">查看 Packages</a>
    </div>
    <small><span id="count">0</span> 个软件包 · iphoneos-arm64e / all</small>
  </main>
  <script>
    fetch('package-count.txt', {cache: 'no-store'})
      .then(response => response.ok ? response.text() : '0')
      .then(count => document.querySelector('#count').textContent = count.trim())
      .catch(() => {});
  </script>
</body>
</html>
